<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhes do Ativo · Inventar.IO</title>
<meta name="description" content="Página de detalhes de ativo de TI — Inventar.IO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────────── */
:root{
  --ink:#0e1726;--ink-2:#16233a;--ink-line:#233149;
  --paper:#f4f5f7;--surface:#ffffff;
  --brand:#1c62cb;--brand-hover:#144e9e;--brand-light:#ebf1fb;--brand-border:#c4d6f2;
  --ok:#1f8a4c;--ok-light:#e9f6ee;--ok-border:#bfe3cd;
  --warn:#b26a00;--warn-light:#fdf3e1;--warn-border:#f0d9a8;
  --crit:#c62828;--crit-light:#fceaea;--crit-border:#f2c5c5;
  --border:#dde1e7;--border-light:#e9ecf0;
  --text-1:#141f2e;--text-2:#4b5563;--text-3:#7a828e;--text-dis:#b2b8c2;
  --r-sm:6px;--r-md:8px;--r-lg:10px;--r-xl:14px;
  --shadow:0 1px 2px #0f172a0a,0 1px 3px #0f172a0f;
  --shadow-h:0 8px 24px #0f172a14;
  --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --t:.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--text-1);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ── App bar (fixa, vidro) ───────────────────────────────────── */
body{padding-top:64px}
.appbar{position:fixed;top:0;left:0;right:0;z-index:100;color:#e8ecf3;background:rgba(13,21,36,.88);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.07)}
.appbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(110,168,255,.5),transparent 95%);pointer-events:none}
.appbar-inner{max-width:1280px;margin:0 auto;padding:0 2rem;height:64px;display:flex;align-items:center;gap:2rem}
@media(max-width:768px){.appbar-inner{padding:0 1rem;gap:1rem}}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:inherit}
.brand-icon{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3b82f6,#1c62cb 55%,#7c5cff);box-shadow:0 4px 14px rgba(28,98,203,.45),inset 0 1px 0 rgba(255,255,255,.28);color:#fff}
.brand-name{font-size:.98rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.brand-name .io{font-family:var(--mono);font-weight:700;color:#6ea8ff}
.brand-name small{display:block;font-size:.6rem;font-weight:600;color:#8b97ab;text-transform:uppercase;letter-spacing:.14em}
.appbar-nav{display:flex;gap:.25rem;padding:.28rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:99px}
.appbar-nav a{padding:.42rem 1rem;border-radius:99px;font-size:.8rem;font-weight:600;color:#aeb9ca;text-decoration:none;transition:color var(--t),background var(--t)}
.appbar-nav a:hover{color:#fff}
.appbar-nav a.active{color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

/* ── Layout ─────────────────────────────────────────────────── */
.page{max-width:1280px;margin:0 auto;padding:1.5rem 2rem 5rem}
@media(max-width:768px){.page{padding:1rem 1rem 4rem}}

/* ── Breadcrumb ─────────────────────────────────────────────── */
.topnav{display:flex;align-items:center;gap:.85rem;margin-bottom:1.25rem;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .8rem;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-family:var(--sans);font-size:.8rem;font-weight:600;cursor:pointer;transition:background var(--t),border-color var(--t);text-decoration:none}
.back-btn:hover{background:var(--paper);border-color:var(--text-3)}
.back-btn svg{stroke:currentColor;flex:none}
.breadcrumb{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--text-3)}
.breadcrumb a{color:var(--brand);text-decoration:none;font-weight:600}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{color:var(--text-dis)}
.breadcrumb .current{font-family:var(--mono);font-weight:600;color:var(--text-2)}

/* ── Asset header ───────────────────────────────────────────── */
.asset-head{background:var(--surface);border:1px solid var(--border-light);border-left:4px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:1.35rem 1.5rem;margin-bottom:1.25rem}
.asset-head.st-ok{border-left-color:var(--ok)}
.asset-head.st-atencao{border-left-color:var(--warn)}
.asset-head.st-critico{border-left-color:var(--crit)}
.asset-head.st-offline{border-left-color:var(--text-dis)}
.asset-head-top{display:flex;align-items:center;gap:.85rem;flex-wrap:wrap;margin-bottom:.75rem}
.asset-hostname{font-family:var(--mono);font-size:1.35rem;font-weight:700;letter-spacing:-.01em;word-break:break-all}
.status-pill{display:inline-flex;align-items:center;gap:.45rem;padding:.28rem .75rem;border-radius:99px;font-size:.74rem;font-weight:700;border:1px solid}
.status-pill .led{width:8px;height:8px;border-radius:50%}
.status-pill.st-ok{background:var(--ok-light);border-color:var(--ok-border);color:var(--ok)}
.status-pill.st-ok .led{background:var(--ok)}
.status-pill.st-atencao{background:var(--warn-light);border-color:var(--warn-border);color:var(--warn)}
.status-pill.st-atencao .led{background:var(--warn)}
.status-pill.st-critico{background:var(--crit-light);border-color:var(--crit-border);color:var(--crit)}
.status-pill.st-critico .led{background:var(--crit);animation:pulse 1.4s infinite}
.status-pill.st-offline{background:var(--paper);border-color:var(--border);color:var(--text-3)}
.status-pill.st-offline .led{background:var(--text-dis)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.asset-head-meta{display:flex;flex-wrap:wrap;gap:.4rem .5rem}
.meta-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.28rem .65rem;background:var(--paper);border:1px solid var(--border-light);border-radius:var(--r-md);font-size:.75rem;color:var(--text-2)}
.meta-chip b{font-weight:700;color:var(--text-3);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em}
.meta-chip .v{font-family:var(--mono);font-weight:600;color:var(--text-1)}
.meta-chip.chip-warn{background:var(--warn-light);border-color:var(--warn-border);color:var(--warn)}
.meta-chip.chip-warn .v{color:var(--warn)}

/* ── Grid ───────────────────────────────────────────────────── */
.main-container{display:grid;grid-template-columns:360px 1fr;gap:1.25rem;align-items:start}
@media(max-width:1024px){.main-container{grid-template-columns:1fr}}
.left-panel{display:flex;flex-direction:column;gap:1.25rem}
.right-panel{display:flex;flex-direction:column;gap:1.25rem;min-width:0}

/* ── Info sections (left) ───────────────────────────────────── */
.info-section{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden}
.info-header{display:flex;align-items:center;gap:.55rem;padding:.8rem 1.15rem;border-bottom:1px solid var(--border-light)}
.info-header svg{stroke:var(--text-3);flex:none}
.info-title{font-size:.72rem;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.07em}
.info-body{padding:.5rem 1.15rem .75rem}
.info-item{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;padding:.5rem 0;border-bottom:1px solid var(--border-light)}
.info-item:last-child{border-bottom:none}
.info-label{font-size:.72rem;color:var(--text-3);font-weight:600;flex:none}
.info-value{font-family:var(--mono);font-size:.78rem;color:var(--text-1);font-weight:600;word-break:break-all;text-align:right}

/* ── Tabs ───────────────────────────────────────────────────── */
.tab-bar{display:flex;gap:.25rem;background:var(--surface);border:1px solid var(--border-light);padding:.3rem;border-radius:var(--r-lg);box-shadow:var(--shadow);overflow-x:auto}
.tab-btn{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .95rem;border:none;border-radius:var(--r-md);background:transparent;color:var(--text-3);font-family:var(--sans);font-size:.82rem;font-weight:600;cursor:pointer;transition:color var(--t),background var(--t);white-space:nowrap}
.tab-btn svg{flex:none}
.tab-btn:hover{color:var(--text-1);background:var(--paper)}
.tab-btn.active{color:#fff;background:var(--ink)}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── KPI cards ──────────────────────────────────────────────── */
.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.85rem;margin-bottom:1.25rem}
.kpi-card{position:relative;background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:.95rem 1.1rem;box-shadow:var(--shadow);overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border)}
.kpi-card.ok::before{background:var(--ok)}
.kpi-card.warn::before{background:var(--warn)}
.kpi-card.crit::before{background:var(--crit)}
.kpi-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:.35rem}
.kpi-val{font-family:var(--mono);font-size:1.6rem;font-weight:700;line-height:1;color:var(--text-1)}
.kpi-card.ok .kpi-val{color:var(--ok)}
.kpi-card.warn .kpi-val{color:var(--warn)}
.kpi-card.crit .kpi-val{color:var(--crit)}
.kpi-sub{font-size:.7rem;color:var(--text-3);margin-top:.3rem}

/* ── Section card ───────────────────────────────────────────── */
.sec-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.25rem}
.sec-card:last-child{margin-bottom:0}
.sec-head{display:flex;align-items:center;gap:.55rem;padding:.85rem 1.25rem;border-bottom:1px solid var(--border-light)}
.sec-head svg{stroke:var(--text-3);flex:none}
.sec-title{font-size:.86rem;font-weight:700;color:var(--text-1)}
.sec-count{display:inline-flex;align-items:center;justify-content:center;min-width:1.4rem;height:1.3rem;padding:0 .4rem;background:var(--paper);border:1px solid var(--border);border-radius:99px;font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--text-2);margin-left:auto}
.sec-body{padding:1rem 1.25rem}
.sub-label{font-size:.68rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 .45rem}
.sub-label + .sub-label,.dev-list + .sub-label,.net-item + .sub-label,.empty-text + .sub-label{margin-top:.9rem}

/* ── KV table ───────────────────────────────────────────────── */
.kv{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1rem;font-size:.82rem}
.kv dt{color:var(--text-3);white-space:nowrap;font-weight:500}
.kv dd{font-family:var(--mono);font-size:.78rem;color:var(--text-1);font-weight:600;word-break:break-all}

/* ── Dev list ───────────────────────────────────────────────── */
.dev-list{display:grid;gap:.4rem;margin-bottom:.25rem}
.dev-item{background:var(--paper);border:1px solid var(--border-light);border-radius:var(--r-md);padding:.55rem .8rem;font-size:.8rem;color:var(--text-2)}
.dev-item strong{color:var(--text-1);font-weight:600;display:block;margin-bottom:.05rem}
.dev-item span{font-family:var(--mono);color:var(--text-3);font-size:.7rem}

/* ── Antivírus ──────────────────────────────────────────────── */
.av-item{display:flex;align-items:center;gap:.7rem;padding:.6rem .85rem;background:var(--paper);border:1px solid var(--border-light);border-radius:var(--r-md);margin-bottom:.4rem}
.av-item:last-child{margin-bottom:0}
.av-icon{width:30px;height:30px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex:none}
.av-icon.active{background:var(--ok-light);color:var(--ok)}
.av-icon.inactive{background:var(--crit-light);color:var(--crit)}
.av-name{font-size:.83rem;font-weight:700;color:var(--text-1)}
.av-meta{font-size:.72rem;color:var(--text-3)}
.av-badge{padding:.18rem .55rem;border-radius:99px;font-size:.68rem;font-weight:700;margin-left:auto;flex:none;white-space:nowrap;border:1px solid}
.av-badge.active{background:var(--ok-light);border-color:var(--ok-border);color:var(--ok)}
.av-badge.inactive{background:var(--crit-light);border-color:var(--crit-border);color:var(--crit)}

/* ── Software ───────────────────────────────────────────────── */
.sw-search-wrap{position:relative;margin-bottom:.75rem}
.sw-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);stroke:var(--text-3)}
.sw-search{width:100%;background:var(--paper);border:1px solid var(--border);color:var(--text-1);border-radius:var(--r-md);padding:.5rem .75rem .5rem 2.1rem;font-family:var(--sans);font-size:.83rem;transition:border-color var(--t),box-shadow var(--t),background var(--t)}
.sw-search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #1c62cb1f;background:var(--surface)}
.sw-search::placeholder{color:var(--text-dis)}
.sw-table{width:100%;border-collapse:collapse;font-size:.8rem}
.sw-table th{padding:.45rem .5rem;text-align:left;font-size:.66rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid var(--border-light)}
.sw-table th:last-child{text-align:right}
.sw-table td{padding:.42rem .5rem;border-bottom:1px solid var(--border-light);color:var(--text-1)}
.sw-table td:last-child{font-family:var(--mono);color:var(--text-3);text-align:right;white-space:nowrap;font-size:.72rem}
.sw-table tbody tr:hover{background:var(--brand-light)}
.sw-count{font-family:var(--mono);font-size:.72rem;color:var(--text-3);margin-top:.6rem;text-align:right}

/* ── Rede ───────────────────────────────────────────────────── */
.net-item{background:var(--paper);border:1px solid var(--border-light);border-radius:var(--r-md);padding:.6rem .85rem;margin-bottom:.4rem}
.net-item:last-child{margin-bottom:0}
.net-name{font-size:.82rem;font-weight:700;color:var(--text-1);margin-bottom:.3rem}
.net-pills{display:flex;flex-wrap:wrap;gap:.35rem}
.net-pill{display:inline-flex;align-items:center;padding:.18rem .55rem;background:var(--surface);border:1px solid var(--border);border-radius:99px;font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--text-2)}
.net-pill.ip{border-color:var(--brand-border);background:var(--brand-light);color:var(--brand)}
.net-pill.mac{color:var(--text-3)}

/* ── Discos ─────────────────────────────────────────────────── */
.disk-item{background:var(--paper);border:1px solid var(--border-light);border-radius:var(--r-md);padding:.7rem .9rem;margin-bottom:.4rem}
.disk-item:last-child{margin-bottom:0}
.disk-top{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem;margin-bottom:.45rem}
.disk-name{font-size:.82rem;font-weight:700;color:var(--text-1)}
.disk-meta{font-family:var(--mono);font-size:.7rem;color:var(--text-3);white-space:nowrap}
.disk-track{height:6px;background:var(--border-light);border-radius:3px;overflow:hidden}
.disk-fill{height:100%;border-radius:3px;transition:width .6s ease}
.disk-foot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68rem;color:var(--text-3);margin-top:.35rem}

/* ── Gráfico de histórico ───────────────────────────────────── */
.chart-wrap{width:100%}
.chart-legend{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.6rem}
.chart-legend span{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:600;color:var(--text-2)}
.chart-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chart-svg{width:100%;height:auto;display:block}

/* ── Impressoras / badges ───────────────────────────────────── */
.dev-badges{display:inline-flex;gap:.3rem;margin-left:.4rem;vertical-align:middle}
.dev-badge{display:inline-flex;align-items:center;padding:.1rem .45rem;border-radius:99px;font-size:.62rem;font-weight:700;background:var(--brand-light);border:1px solid var(--brand-border);color:var(--brand)}

/* ── Loading / erro ─────────────────────────────────────────── */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:1rem;color:var(--text-3);grid-column:1/-1}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{text-align:center;padding:5rem 2rem;color:var(--text-3);grid-column:1/-1}
.error-state h2{font-size:1.1rem;font-weight:700;color:var(--text-2);margin-bottom:.4rem}
.error-state a{color:var(--brand);font-weight:600}
.empty-text{font-size:.78rem;color:var(--text-3);padding:.35rem 0 .5rem}

::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <a class="brand" href="/">
      <div class="brand-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
      </div>
      <div class="brand-name">Inventar<span class="io">.IO</span><small>Gestão de ativos</small></div>
    </a>
    <nav class="appbar-nav">
      <a href="/" class="active">Console</a>
      <a href="/instalar.html">Instalar agente</a>
    </nav>
  </div>
</header>

<main class="page" id="page">

  <div class="topnav">
    <a class="back-btn" href="/" id="back-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      Voltar
    </a>
    <div class="breadcrumb">
      <a href="/">Inventário</a>
      <span class="sep">›</span>
      <span class="current" id="bc-hostname">Ativo</span>
    </div>
  </div>

  <!-- Conteúdo preenchido via JS -->
  <div id="content" class="main-container">
    <div class="loading-state">
      <div class="spinner"></div>
      <span>Carregando dados do ativo...</span>
    </div>
  </div>

</main>

<script>
(function(){
  /* ── helpers ─────────────────────────────────────────────── */
  var qs=function(s,ctx){return (ctx||document).querySelector(s);};

  var esc=function(v){
    return String(v==null?'':v).replace(/[&<>"']/g,function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  };
  var fmtBytes=function(b){
    if(!b)return '—';
    var u=['B','KB','MB','GB','TB'],i=0; b=Number(b);
    while(b>=1024&&i<u.length-1){b/=1024;i++;}
    return b.toFixed(i?1:0)+' '+u[i];
  };
  var fmtUptime=function(sec){
    if(sec==null)return null;
    var d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600);
    if(d>0)return d+'d '+h+'h';
    var m=Math.floor((sec%3600)/60);
    return h>0?h+'h '+m+'min':m+'min';
  };
  var gcClass=function(v){
    if(v==null)return '';
    if(v>=90)return 'crit';
    if(v>=75)return 'warn';
    return 'ok';
  };
  var gc=function(v){
    if(v==null)return 'var(--text-dis)';
    if(v>=90)return 'var(--crit)';
    if(v>=75)return 'var(--warn)';
    return 'var(--ok)';
  };
  var ago=function(iso){
    if(!iso)return '—';
    var s=(Date.now()-new Date(iso))/1000;
    if(s<90)return 'agora';
    if(s<5400)return Math.round(s/60)+' min atrás';
    if(s<172800)return Math.round(s/3600)+' h atrás';
    return Math.round(s/86400)+' dias atrás';
  };
  var kv=function(l,v){
    if(v==null||v==='')return '';
    return '<dt>'+esc(l)+'</dt><dd>'+esc(v)+'</dd>';

  /* ── Gráfico de histórico (SVG inline, sem libs) ─────────── */
  function historyChart(hist){
    var pts=(hist||[]).filter(function(p){return p.cpu!=null||p.memory!=null||p.disk!=null;});
    if(pts.length<2)return '';
    var W=640,H=160,PL=34,PR=8,PT=10,PB=22;
    var iw=W-PL-PR,ih=H-PT-PB;
    var x=function(i){return PL+iw*(i/(pts.length-1));};
    var y=function(v){return PT+ih*(1-Math.max(0,Math.min(100,v))/100);};
    function line(key){
      var d='';
      pts.forEach(function(p,i){
        if(p[key]==null)return;
        d+=(d?' L':'M')+x(i).toFixed(1)+' '+y(p[key]).toFixed(1);
      });
      return d;
    }
    var grid='';
    [0,25,50,75,100].forEach(function(v){
      grid+='<line x1="'+PL+'" y1="'+y(v)+'" x2="'+(W-PR)+'" y2="'+y(v)+'" stroke="var(--border-light)" stroke-width="1"/>'
        +'<text x="'+(PL-6)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="9" fill="var(--text-3)" font-family="var(--mono)">'+v+'</text>';
    });
    var t0=new Date(pts[0].ts),t1=new Date(pts[pts.length-1].ts);
    var fmt=function(t){return t.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};
    var SERIES={cpu:'#1c62cb',memory:'#0e9488',disk:'#7a5af8'};
    return '<div class="chart-wrap">'
      +'<div class="chart-legend">'
      +'<span><i style="background:'+SERIES.cpu+'"></i>CPU</span>'
      +'<span><i style="background:'+SERIES.memory+'"></i>Memória</span>'
      +'<span><i style="background:'+SERIES.disk+'"></i>Disco</span>'
      +'</div>'
      +'<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Histórico de uso de CPU, memória e disco">'
      +grid
      +'<path d="'+line('disk')+'" fill="none" stroke="'+SERIES.disk+'" stroke-width="1.5" stroke-linejoin="round"/>'
      +'<path d="'+line('memory')+'" fill="none" stroke="'+SERIES.memory+'" stroke-width="1.5" stroke-linejoin="round"/>'
      +'<path d="'+line('cpu')+'" fill="none" stroke="'+SERIES.cpu+'" stroke-width="2" stroke-linejoin="round"/>'
      +'<text x="'+PL+'" y="'+(H-6)+'" font-size="9" fill="var(--text-3)" font-family="var(--mono)">'+fmt(t0)+'</text>'
      +'<text x="'+(W-PR)+'" y="'+(H-6)+'" text-anchor="end" font-size="9" fill="var(--text-3)" font-family="var(--mono)">'+fmt(t1)+'</text>'
      +'</svg>'
      +'</div>';
  }

      +'<input class="sw-search" id="'+swSearchId+'" placeholder="Filtrar por nome do programa..." autocomplete="off">'
      +'</div>'
      +'<table class="sw-table">'
      +'<thead><tr><th>Nome</th>'+(swHasPublisher?'<th style="text-align:left">Fornecedor</th>':'')+'<th>Versão</th></tr></thead>'
      +'<tbody id="'+swId+'"></tbody>'
      +'</table>'
      +'<div class="sw-count" id="'+swCountId+'">'+sw.length+' programas</div>';

    /* ── Painel esquerdo ── */
    var ipPrimary=net.interfaces&&net.interfaces[0]&&net.interfaces[0].ipv4&&net.interfaces[0].ipv4[0];
    var macPrimary=net.interfaces&&net.interfaces[0]&&net.interfaces[0].mac;

    var leftPanelHTML=
      '<div class="info-section">'
      +'<div class="info-header">'+IC.tag+'<span class="info-title">Identificação</span></div>'
      +'<div class="info-body">'
      +infoItem('Fabricante',sys.manufacturer)
      +infoItem('Modelo',sys.model)
      +infoItem('Serial (BIOS)',sys.bios_serial)
      +infoItem('Sistema',sys.os_caption)
      +'</div>'
      +'</div>'

      +'<div class="info-section">'
      +'<div class="info-header">'+IC.globe+'<span class="info-title">Conectividade</span></div>'
      +'<div class="info-body">'
      +infoItem('IP principal',ipPrimary)
      +infoItem('MAC',macPrimary)
      +infoItem('Domínio',sys.domain)
      +infoItem('Usuário logado',sys.logged_user)
      +'</div>'
      +'</div>';

    /* ── Painel direito ── */
    var rightPanelHTML=
      '<div class="tab-bar" role="tablist">'
      +'<button class="tab-btn active" data-tab="overview">'+IC.chart+'Visão geral</button>'
      +'<button class="tab-btn" data-tab="hardware">'+IC.cpu+'Hardware</button>'
      +'<button class="tab-btn" data-tab="dispositivos">'+IC.plug+'Dispositivos</button>'
      +'<button class="tab-btn" data-tab="software">'+IC.box+'Software</button>'
      +'</div>'

      /* ── Aba: Visão geral ── */
      +'<div class="tab-content active" data-tab="overview">'
      +'<div class="health-grid">'
      +'<div class="kpi-card '+gcClass(cpuVal)+'">'
        +'<div class="kpi-label">CPU</div>'
        +'<div class="kpi-val">'+(cpuVal!=null?Math.round(cpuVal)+'%':'—')+'</div>'
        +'<div class="kpi-sub">uso atual</div>'
      +'</div>'
      +'<div class="kpi-card '+gcClass(ramVal)+'">'
        +'<div class="kpi-label">Memória</div>'
        +'<div class="kpi-val">'+(ramVal!=null?Math.round(ramVal)+'%':'—')+'</div>'
        +'<div class="kpi-sub">'+(hw.memory&&hw.memory.total_bytes?'de '+fmtBytes(hw.memory.total_bytes):'em uso')+'</div>'
      +'</div>'
      +'<div class="kpi-card '+gcClass(diskVal)+'">'
        +'<div class="kpi-label">Disco</div>'
        +'<div class="kpi-val">'+(diskVal!=null?Math.round(diskVal)+'%':'—')+'</div>'
        +'<div class="kpi-sub">ocupação máxima</div>'
      +'</div>'
      +'<div class="kpi-card">'
        +'<div class="kpi-label">Temperatura</div>'
        +'<div class="kpi-val">'+(health.temp_max_c?health.temp_max_c+'°C':'—')+'</div>'
        +'<div class="kpi-sub">máxima registrada</div>'
      +'</div>'
      +batteryKPI
      +'</div>'
      +(chartHTML?'<div class="sec-card">'
      +'<div class="sec-head">'+IC.pulse+'<span class="sec-title">Histórico de desempenho</span><span class="sec-count">'+(a.history||[]).length+'</span></div>'
      +'<div class="sec-body">'+chartHTML+'</div>'
      +'</div>':'')
      +'<div class="sec-card">'
      +'<div class="sec-head">'+IC.shield+'<span class="sec-title">Antivírus</span></div>'
      +'<div class="sec-body">'+avHTML+'</div>'
      +'</div>'
      +'</div>'

      /* ── Aba: Hardware ── */
      +'<div class="tab-content" data-tab="hardware">'
      +'<div class="sec-card">'
      +'<div class="sec-head">'+IC.cpu+'<span class="sec-title">Especificações</span></div>'
      +'<div class="sec-body"><dl class="kv">'
      +kv('Processador',hw.cpu&&hw.cpu.name)
      +kv('Núcleos',hw.cpu?hw.cpu.cores_physical+' físicos · '+hw.cpu.cores_logical+' lógicos':null)
      +kv('Frequência',hw.cpu&&hw.cpu.freq_mhz?hw.cpu.freq_mhz+' MHz':null)
      +kv('Memória RAM',hw.memory&&hw.memory.total_bytes?fmtBytes(hw.memory.total_bytes):null)
      +kv('GPU',(hw.gpu||[]).map(function(g){return g.name;}).join(', ')||null)
      +'</dl></div>'
      +'</div>'
      +'<div class="sec-card">'
      +'<div class="sec-head">'+IC.hd+'<span class="sec-title">Armazenamento</span><span class="sec-count">'+(storage.length||(hw.disks||[]).length)+'</span></div>'
      +'<div class="sec-body">'
      +(storageHTML?'<p class="sub-label">Partições</p>'+storageHTML:'')
      +(disksHTML?'<p class="sub-label">Discos físicos</p>'+disksHTML:'')
      +(hasStorageInfo?'':'<p class="empty-text">Sem informações de disco.</p>')
      +'</div>'
      +'</div>'
      +'</div>'

      /* ── Aba: Dispositivos ── */
      +'<div class="tab-content" data-tab="dispositivos">'
      +'<div class="sec-card">'
      +'<div class="sec-head">'+IC.plug+'<span class="sec-title">Periféricos e rede</span></div>'
      +'<div class="sec-body">'
      +'<p class="sub-label">USB</p>'
      +usbHTML
      +'<p class="sub-label">Monitores</p>'
      +monHTML
      +(prnHTML?'<p class="sub-label">Impressoras</p>'+prnHTML:'')
      +(remHTML?'<p class="sub-label">Drives removíveis</p>'+remHTML:'')
      +'<p class="sub-label">Interfaces de rede</p>'
      +netHTML
      +'</div>'
      +'</div>'
      +'</div>'

      /* ── Aba: Software ── */
      +'<div class="tab-content" data-tab="software">'
      +'<div class="sec-card">'
      +'<div class="sec-head">'+IC.box+'<span class="sec-title">Software instalado</span><span class="sec-count">'+sw.length+'</span></div>'
      +'<div class="sec-body">'+swHTML+'</div>'
      +'</div>'
      +(patchHTML?'<div class="sec-card">'
      +'<div class="sec-head">'+IC.patch+'<span class="sec-title">Atualizações do Windows</span><span class="sec-count">'+patches.length+'</span></div>'
      +'<div class="sec-body">'+patchHTML+'</div>'
      +'</div>':'')
      +'</div>';

    /* ── Render ── */
    qs('#content').innerHTML=
      headHTML
      +'<div class="left-panel">'+leftPanelHTML+'</div>'
      +'<div class="right-panel">'+rightPanelHTML+'</div>';

    /* ── Troca de abas ── */
    var tabBtns=qs('#content').querySelectorAll('.tab-btn');
    var tabContents=qs('#content').querySelectorAll('.tab-content');
    tabBtns.forEach(function(btn){
      btn.addEventListener('click',function(){
        var tab=this.getAttribute('data-tab');
        tabBtns.forEach(function(b){b.classList.remove('active');});
        tabContents.forEach(function(c){c.classList.remove('active');});
        btn.classList.add('active');
        qs('.tab-content[data-tab="'+tab+'"]').classList.add('active');
      });
    });

    /* ── Filtro de software ── */
    var swData=sw;
    var tbody=qs('#'+swId);
    var countEl=qs('#'+swCountId);
    function renderSW(list){
      tbody.innerHTML=list.map(function(s){
        return '<tr><td>'+esc(s.name||'—')+'</td>'
          +(swHasPublisher?'<td style="color:var(--text-3);text-align:left;font-family:var(--sans);font-size:.78rem">'+esc(s.publisher||'')+'</td>':'')
          +'<td>'+esc(s.version||'')+'</td></tr>';
      }).join('');
      countEl.textContent=list.length+' / '+swData.length+' programas';
    }
    renderSW(swData);
    qs('#'+swSearchId).addEventListener('input',function(e){
      var q=e.target.value.toLowerCase().trim();
      renderSW(q?swData.filter(function(s){return (s.name||'').toLowerCase().indexOf(q)>-1;}):swData);
    });
  }

  /* ── Load ─────────────────────────────────────────────────── */
  function load(){
    if(!assetId){
      qs('#content').innerHTML='<div class="error-state"><h2>ID de ativo não informado</h2><p>Abra esta página a partir do <a href="/">console de ativos</a>.</p></div>';
      return;
    }
    fetch('/api/assets/'+assetId)
      .then(function(r){if(!r.ok)throw new Error('not found');return r.json();})
      .then(renderPage)
      .catch(function(){
        /* fallback demo */
        var demo=DEMO[assetId];
        if(demo){renderPage(demoExtras(demo));}
        else{
          var now=Date.now();
          var generic={
            asset_id:assetId,hostname:'WS-ATIVO-'+assetId,status:'ok',
            last_seen:new Date(now-60000).toISOString(),
            tags:{setor:'TI'},
            system:{manufacturer:'Generic',model:'PC',os_caption:'Windows 11 Pro',logged_user:'usuario',uptime_seconds:172800,domain:'inventar.local',bios_serial:'SN-'+assetId},
            hardware:{cpu:{name:'Intel Core i5',cores_physical:6,cores_logical:12,freq_mhz:3200},memory:{total_bytes:8589934592},gpu:[],disks:[]},
            health:{cpu_percent:35,memory_percent:55,disk_worst_percent:45,pending_reboot:false,antivirus:[{name:'Microsoft Defender',enabled:true,up_to_date:true}]},
            network:{interfaces:[{name:'Ethernet',ipv4:['192.168.1.'+assetId],mac:'00:AA:BB:CC:DD:'+assetId}]},
            devices:{usb:[],monitors:[],removable_drives:[]},
            software:[{name:'Microsoft 365',version:'16.0'},{name:'Google Chrome',version:'126.0'}]
          };
          renderPage(demoExtras(generic));
        }
      });
  }

  load();
})();
</script>
</body>
</html>
